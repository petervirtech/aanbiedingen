<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aanbiedingen{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="/" class="logo">🛒 Aanbiedingen</a>
            <nav>
                <a href="/compare">Vergelijken</a>
                <a href="/history">Geschiedenis</a>
                <a href="/stores">Winkels</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Data: checkjebon.nl + SupermarktConnector · Voer eigen winkel toe via plugin</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
